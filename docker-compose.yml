# Local development database only. Do not use these credentials in production.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crypto
      POSTGRES_PASSWORD: crypto_local_dev
      POSTGRES_DB: crypto_ai_analyst
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crypto -d crypto_ai_analyst"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
